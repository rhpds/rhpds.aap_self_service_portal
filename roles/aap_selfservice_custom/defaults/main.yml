---
# SPDX-License-Identifier: MIT-0
# ===================================================================
# AAP Self-Service Custom Content Role
# ===================================================================
# Configures AAP instances with demo users, inventories, credentials,
# projects, and job templates for self-service portal demonstrations
#
# Maintainer: Hicham Mourad <hmourad@redhat.com>
# Source: https://github.com/ansible-tmm/ssap-lab

# -------------------------------------------------------------------
# AAP Controller Connection Settings
# -------------------------------------------------------------------
# These will be populated from agnosticd_user_data lookup plugin
aap_selfservice_custom_controller_url: ""
aap_selfservice_custom_admin_username: "admin"
aap_selfservice_custom_admin_password: ""
aap_selfservice_custom_organization: "Default"
aap_selfservice_custom_verify_ssl: false

# User password for demo accounts
# Will use common_password from workshop deployment
aap_selfservice_custom_user_password: "{{ common_password | default('ansible123!') }}"

# -------------------------------------------------------------------
# Demo Users Configuration
# -------------------------------------------------------------------
aap_selfservice_custom_users:
  - username: clouduser1
    password: "{{ aap_selfservice_custom_user_password }}"
    email: clouduser1@example.org
    first_name: Cloud
    last_name: CloudUser1

  - username: networkuser1
    password: "{{ aap_selfservice_custom_user_password }}"
    email: networkuser1@example.org
    first_name: Network
    last_name: NetworkUser1

  - username: rheluser1
    password: "{{ aap_selfservice_custom_user_password }}"
    email: rheluser1@example.org
    first_name: RHEL
    last_name: RHELUser1

# -------------------------------------------------------------------
# Demo Inventories Configuration
# -------------------------------------------------------------------
aap_selfservice_custom_inventories:
  - name: AWS Inventory
    organization: Default

  - name: Azure Inventory
    organization: Default

  - name: GCP Inventory
    organization: Default

  - name: RHEL Inventory
    organization: Default

  - name: Network Inventory
    organization: Default

  # Localhost for API-only JTs (GitHub join, etc.)
  - name: Localhost Inventory
    organization: Default

# -------------------------------------------------------------------
# Demo Credentials Configuration
# -------------------------------------------------------------------
# NOTE: These are placeholder credentials for CNV/demo environments
# In production, use proper credential management
aap_selfservice_custom_credentials:
  - name: AWS Credentials
    description: Amazon Web Services
    organization: Default
    credential_type: Amazon Web Services
    inputs:
      username: "blahblahblahAWSACCESSKEYID"
      password: "blahblahlahAWSSECRETACCESSKEY"

  - name: Azure Credentials
    description: Microsoft Azure
    organization: Default
    credential_type: Microsoft Azure Resource Manager
    inputs:
      subscription: "blahblahblahSUBSCRIPTIONID"

  - name: RHEL - SSH Credentials
    description: SSH credentials for RHEL systems
    organization: Default
    credential_type: Machine
    inputs: {}

  - name: Network Credentials
    description: Network device credentials
    organization: Default
    credential_type: Machine
    inputs: {}

# -------------------------------------------------------------------
# Demo Projects Configuration
# -------------------------------------------------------------------
aap_selfservice_custom_projects:
  - name: SelfService Demo playbooks
    description: This is a project for the self-service portal demos
    organization: Default
    scm_type: git
    scm_url: https://github.com/ansible-tmm/ssap-lab
    scm_branch: fix/realistic-time-server-output
    default_environment: Default execution environment

# -------------------------------------------------------------------
# Demo Labels Configuration
# -------------------------------------------------------------------
aap_selfservice_custom_labels:
  - name: aws
    organization: Default

  - name: rhel
    organization: Default

  - name: network
    organization: Default

  - name: custom
    organization: Default

# -------------------------------------------------------------------
# Demo Job Templates Configuration
# -------------------------------------------------------------------
aap_selfservice_custom_job_templates:
  # AWS Job Templates
  - name: Cloud/AWS AWS Provisioning Workflow
    description: NEW AWS provisioning workflow
    job_type: run
    organization: Default
    inventory: AWS Inventory
    project: SelfService Demo playbooks
    playbook: New AWS Provisioning Workflow.yml
    credentials:
      - AWS Credentials
    labels:
      - aws
    ask_inventory_on_launch: true
    ask_credential_on_launch: true

  - name: Cloud/AWS Create RHEL10 instance
    description: Run a job template to create a RHEL 10 instance and provide some details
    job_type: run
    organization: Default
    inventory: AWS Inventory
    project: SelfService Demo playbooks
    playbook: create_aws_ec2_rhel10.yml
    credentials:
      - AWS Credentials
    labels:
      - aws
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL10 server
          question_description: Provide a name for the new server
          required: true
          type: text
          variable: host
          choices: ""
          min: 4
          max: 50
          default: rhel10

  - name: Cloud/AWS Create RHEL9 instance
    description: Run a job template to create a RHEL 9 instance and provide some details
    job_type: run
    organization: Default
    inventory: AWS Inventory
    project: SelfService Demo playbooks
    playbook: create_aws_ec2_rhel9.yml
    credentials:
      - AWS Credentials
    labels:
      - aws
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL9 server
          question_description: Provide a name for the new server
          required: true
          type: text
          variable: host
          choices: ""
          min: 4
          max: 50
          default: rhel9

  - name: Cloud/AWS Create VPC
    description: Run a job template to create an AWS VPC, and all its required networking
    job_type: run
    organization: Default
    inventory: AWS Inventory
    project: SelfService Demo playbooks
    playbook: create_aws_vpc.yml
    credentials:
      - AWS Credentials
    labels:
      - aws
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the AWS VPC
          question_description: Name the VPC
          required: true
          type: text
          variable: vpc_name
          default: my_vpc

  - name: Cloud/AWS Snapshot ec2 instance
    description: Run a job template to capture a snapshot of an AWS ec2 instance
    job_type: run
    organization: Default
    inventory: AWS Inventory
    project: SelfService Demo playbooks
    playbook: snapshot_aws_ec2.yml
    credentials:
      - AWS Credentials
    labels:
      - aws
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the ec2 instance you want to snapshot
          question_description: Provide an ec2 instance name
          required: true
          type: text
          variable: ec2_instance
          default: my-ec2-instance

  # Network Job Templates
  - name: Network/Backup Network Device
    description: Run a job template to BACKUP a network device
    job_type: run
    organization: Default
    inventory: Network Inventory
    project: SelfService Demo playbooks
    playbook: network_backup_device.yml
    credentials:
      - Network Credentials
    labels:
      - network
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the NETWORK DEVICE you want to BACKUP
          question_description: Backup a network device
          required: true
          type: multiselect
          variable: networkdevice
          choices:
            - cisco9400-ent1
            - cisco9400-ent2
            - juniperex4600-ent1
            - arubacx9300-ent1
          default: cisco9400-ent1

  - name: Network/Deploy Network device configuration
    description: Run a job template to APPLY a configuration or UPDATE a configuration on a network device
    job_type: run
    organization: Default
    inventory: Network Inventory
    project: SelfService Demo playbooks
    playbook: network_deploy_configuration.yml
    credentials:
      - Network Credentials
    labels:
      - network
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Deploy a Network Device configuration
          question_description: Deploy a Network Device configuration
          required: true
          type: multiselect
          variable: networkdevice
          choices:
            - "Cisco Catalyst 8500"
            - "Cisco Switch"
            - "Aruba Switch"
            - "Fortinet Firewall"
            - "Check Point Firewall"
            - "Cisco Meraki"
          default: ""

  - name: Network/Onboard Network device
    description: Run a job template to ONBOARD a network device
    job_type: run
    organization: Default
    inventory: Network Inventory
    project: SelfService Demo playbooks
    playbook: network_device_onboard.yml
    credentials:
      - Network Credentials
    labels:
      - network
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: What type of Network Device are you onboarding?
          question_description: Onboard a Network Device
          required: true
          type: multiselect
          variable: networkdevice
          choices:
            - "Cisco Catalyst 8500"
            - "Cisco Switch"
            - "Aruba Switch"
            - "Fortinet Firewall"
            - "Check Point Firewall"
            - "Cisco Meraki"
          default: ""

  - name: Network/Restore Network device
    description: Run a job template to RESTORE a network device to a previous configuration
    job_type: run
    organization: Default
    inventory: Network Inventory
    project: SelfService Demo playbooks
    playbook: network_restore_device.yml
    credentials:
      - Network Credentials
    labels:
      - network
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the NETWORK DEVICE you want to RESTORE
          question_description: Restore a network device
          required: true
          type: multiselect
          variable: networkdevice
          choices:
            - cisco9400-ent1
            - cisco9400-ent2
            - juniperex4600-ent1
            - arubacx9300-ent1
          default: ""

  # RHEL Job Templates
  - name: Linux/RHEL Deploy Applications to RHEL
    description: Run a job template to DEPLOY application(s) to RHEL server(s)
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: deploy_application_to_rhel.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL server you want to deploy application(s) to
          question_description: select RHEL server(s) to deploy the application(s) to
          required: true
          type: multiselect
          variable: host
          choices:
            - rhel1
            - rhel2
            - rhel3
            - rhel4
          default: rhel1
        - question_name: What applications would you like to install to RHEL
          question_description: select application(s) to install to the RHEL server(s)
          required: true
          type: multiselect
          variable: application
          choices:
            - Apache
            - Podman
            - MariaDB
            - PostgreSQL
            - "vi Improved (vim)"
          default: Apache

  - name: Linux/RHEL Install NGINX on RHEL
    description: Run a job template to INSTALL NGINX on RHEL server
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: install_nginx.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL server you want to deploy NGINX toapplication(s) to
          question_description: Deploy NGINX to RHEL server(s)
          required: true
          type: multiselect
          variable: host
          choices:
            - rhel1
            - rhel2
            - rhel3
            - rhel4
          default: rhel1

  - name: Linux/RHEL Patch RHEL Servers
    description: Run a job template to PATCH RHEL servers
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: patch_rhel_servers.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL server you want to PATCH
          question_description: RHEL server you want to PATCH
          required: true
          type: multiselect
          variable: host
          choices:
            - rhel1
            - rhel2
            - rhel3
            - rhel4
          default: rhel1

  - name: Linux/RHEL START Service on RHEL
    description: Run a job template to START a Linux service that you provide on RHEL
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: start_rhel_service.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL server you want to START a service on
          question_description: Select RHEL server(s) to start the service on
          required: true
          type: multiselect
          variable: host
          choices:
            - rhel1
            - rhel2
            - rhel3
            - rhel4
          default: rhel1
        - question_name: Enter a name for the RHEL SERVICE you want to START
          question_description: Enter the service you want to START
          required: true
          type: text
          variable: service
          default: firewalld

  - name: Linux/RHEL STOP Service on RHEL
    description: Run a job template to STOP a Linux service that you provide on RHEL
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: stop_rhel_service.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: Enter a name for the RHEL server you want to STOP a service on
          question_description: Select RHEL server(s) to stop the service on
          required: true
          type: multiselect
          variable: host
          choices:
            - rhel1
            - rhel2
            - rhel3
            - rhel4
          default: ""
        - question_name: Enter a name for the RHEL SERVICE you want to STOP
          question_description: Enter the service you want to STOP
          required: true
          type: text
          variable: service
          default: ntpd

  - name: RHEL / Update RHEL Time Servers
    description: The Imported CUSTOM template in Self-Service portal will point to this job template
    job_type: run
    organization: Default
    inventory: RHEL Inventory
    project: SelfService Demo playbooks
    playbook: update_rhel_time_server.yml
    credentials:
      - RHEL - SSH Credentials
    labels:
      - rhel
      - custom
    ask_inventory_on_launch: true
    ask_credential_on_launch: true
    ask_variables_on_launch: true

  # EE Builder — invite student GitHub user into lab team (push on EE repo only)
  - name: GitHub/Join lab team
    description: >-
      Add your GitHub username to the lab team with write access on your
      pre-created EE repo (PR + Actions dispatch). Accept the org invite email if prompted.
    job_type: run
    organization: Default
    inventory: Localhost Inventory
    project: SelfService Demo playbooks
    playbook: join_github_org.yml
    credentials:
      - Portal GitHub Token
    labels:
      - custom
    ask_inventory_on_launch: false
    ask_credential_on_launch: false
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: GitHub username
          question_description: Your GitHub login (not email). You will get an org/team invite if not already a member.
          required: true
          type: text
          variable: github_username
          choices: ""
          min: 1
          max: 39
          default: ""
    # extra_vars set in setup_job_templates.yml per instance:
    #   github_org, github_team=lab-{{ guid }}, github_repo={{ guid }}-{{ user }}-ee

