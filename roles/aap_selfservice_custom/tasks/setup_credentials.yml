---
# SPDX-License-Identifier: MIT-0
# Create demo credentials in AAP

- name: Display credentials creation start
  ansible.builtin.debug:
    msg: "Creating {{ aap_selfservice_custom_credentials | length }} demo credentials..."
  when: aap_selfservice_custom_debug | bool

- name: Create AAP credentials
  ansible.controller.credential:
    name: "{{ item.name }}"
    description: "{{ item.description | default('') }}"
    organization: "{{ item.organization | default(aap_selfservice_custom_organization) }}"
    credential_type: "{{ item.credential_type }}"
    inputs: "{{ item.inputs | default({}) }}"
    state: present
    controller_host: "{{ aap_selfservice_custom_controller_url }}"
    controller_oauthtoken: "{{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
  loop: "{{ aap_selfservice_custom_credentials }}"
  loop_control:
    label: "{{ item.name }}"
  register: _credential_result
  failed_when: >-
    _credential_result is failed
    and not (
      aap_selfservice_custom_skip_existing | bool
      and ('already exists' in (_credential_result.msg | default('')))
    )

- name: Display credentials creation complete
  ansible.builtin.debug:
    msg: "Successfully created {{ aap_selfservice_custom_credentials | length }} credentials"

# Portal GitHub org admin PAT (EE Builder lab) — proves vault decrypt + usable in Controller
- name: Create Portal GitHub PAT credential in AAP
  ansible.controller.credential:
    name: "{{ portal_github_credential_name }}"
    description: >-
      Org admin PAT for AAP-Automation-Portal-Lab (EE Builder lab automation).
      Created at provision from portal_github_token.
    organization: "{{ aap_selfservice_custom_organization }}"
    credential_type: GitHub Personal Access Token
    inputs:
      token: "{{ portal_github_token }}"
    state: present
    controller_host: "{{ aap_selfservice_custom_controller_url }}"
    controller_oauthtoken: "{{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
  no_log: true
  when:
    - portal_github_token is defined
    - portal_github_token | length > 0

- name: Confirm Portal GitHub PAT credential created
  ansible.builtin.debug:
    msg: >-
      AAP credential '{{ portal_github_credential_name }}' created
      (GitHub Personal Access Token). Vaulted portal_github_token is usable.
  when:
    - portal_github_token is defined
    - portal_github_token | length > 0
