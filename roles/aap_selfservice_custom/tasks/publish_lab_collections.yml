---
# SPDX-License-Identifier: MIT-0
# Publish bundled Northwind collections into this instance's Hub `published`
# repo so the portal Collections tab can sync them (pahCollections).
#
# Documented galaxy-ng upload path (not handmade inbound repos):
#   ansible-galaxy publish → {gateway}/api/galaxy/
# with admin username/password. That runs the import pipeline into `staging`
# (or straight to `published` if auto-approve). We then move staging → published.
#
# Expects:
#   aap_selfservice_custom_controller_url / _admin_username / _admin_password
#   portal_lab_collections (list of dir names under files/lab_collections/)

- name: Set lab collections workdir
  ansible.builtin.set_fact:
    _lab_collections_src: "{{ role_path }}/files/lab_collections"
    _lab_collections_build: /tmp/portal-lab-collections-build-{{ guid | default('lab') }}
    _lab_galaxy_api: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy"
    _lab_galaxy_publish_url: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy/"
    _lab_galaxy_cfg: /tmp/portal-lab-galaxy-{{ guid | default('lab') }}.cfg

- name: Ensure lab collections build directory
  ansible.builtin.file:
    path: "{{ _lab_collections_build }}"
    state: directory
    mode: "0755"

- name: Build collection tarballs once per provision host
  when: _lab_collection_tarballs is not defined
  block:
    - name: Build each Northwind collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - build
          - "{{ _lab_collections_src }}/{{ item }}"
          - --output-path
          - "{{ _lab_collections_build }}"
      loop: "{{ portal_lab_collections }}"
      changed_when: true

    - name: Find built collection tarballs
      ansible.builtin.find:
        paths: "{{ _lab_collections_build }}"
        patterns: "*.tar.gz"
      register: _lab_collection_find

    - name: Record built tarball paths
      ansible.builtin.set_fact:
        _lab_collection_tarballs: "{{ _lab_collection_find.files | map(attribute='path') | list | sort }}"

    - name: Require built tarballs
      ansible.builtin.assert:
        that:
          - (_lab_collection_tarballs | length) == (portal_lab_collections | length)
        fail_msg: >-
          Expected {{ portal_lab_collections | length }} collection tarballs in
          {{ _lab_collections_build }}, found {{ _lab_collection_tarballs | length }}.

# Namespace must exist before upload. Use Basic auth (same as Hub remotes).
- name: Create Hub namespace via UI API (basic auth)
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/_ui/v1/namespaces/"
    method: POST
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ portal_lab_collection_namespace }}"
      groups: []
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [201, 204, 400, 409]
    return_content: true
  register: _lab_ns_ui_create
  failed_when: false
  no_log: true

- name: Create Hub namespace via v3 API (fallback, basic auth)
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/namespaces/"
    method: POST
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ portal_lab_collection_namespace }}"
      groups: []
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [201, 204, 400, 409]
    return_content: true
  register: _lab_ns_v3_create
  failed_when: false
  no_log: true
  when: (_lab_ns_ui_create.status | default(0)) not in [201, 204, 400, 409]

- name: Confirm Hub namespace exists
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/_ui/v1/namespaces/?name={{ portal_lab_collection_namespace }}"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200]
    return_content: true
  register: _lab_ns_get
  failed_when: false

- name: Fail if Hub namespace could not be created or found
  ansible.builtin.fail:
    msg: >-
      Hub namespace '{{ portal_lab_collection_namespace }}' missing after create.
      UI create HTTP={{ _lab_ns_ui_create.status | default('n/a') }}.
      v3 create HTTP={{ _lab_ns_v3_create.status | default('n/a') }}.
      GET HTTP={{ _lab_ns_get.status | default('n/a') }}
      content={{ _lab_ns_get.content | default('') | truncate(400) }}.
  when: >-
    (_lab_ns_get.status | default(0)) != 200
    or (
      (
        _lab_ns_get.json.meta.count
        | default(_lab_ns_get.json.count
        | default((_lab_ns_get.json.data | default(_lab_ns_get.json.results | default([]))) | length))
      ) | int
    ) < 1

# Prefer admin basic auth for ansible-galaxy (Hub pulp/galaxy).
# --no-wait: CLI import polling often fails on self-signed gateway TLS; we poll Hub APIs.
- name: Write temporary galaxy server config for publish
  ansible.builtin.copy:
    dest: "{{ _lab_galaxy_cfg }}"
    mode: "0600"
    content: |
      [galaxy]
      server_list = lab_hub_publish

      [galaxy_server.lab_hub_publish]
      url = {{ _lab_galaxy_publish_url }}
      username = {{ aap_selfservice_custom_admin_username }}
      password = {{ aap_selfservice_custom_admin_password }}
  no_log: true

- name: Publish each lab collection tarball to Hub /api/galaxy/ (no-wait)
  ansible.builtin.command:
    argv:
      - ansible-galaxy
      - collection
      - publish
      - "{{ item }}"
      - --server
      - lab_hub_publish
      - --ignore-certs
      - --no-wait
  environment:
    ANSIBLE_CONFIG: "{{ _lab_galaxy_cfg }}"
  loop: "{{ _lab_collection_tarballs }}"
  register: _lab_collection_publish
  changed_when: >-
    'already' not in (
      (_lab_collection_publish.stdout | default('')) ~ ' ' ~
      (_lab_collection_publish.stderr | default(''))
    ) | lower
  failed_when: false
  loop_control:
    label: "{{ item | basename }}"

- name: Show ansible-galaxy publish results
  ansible.builtin.debug:
    msg: >-
      {{ item.item | basename }}: rc={{ item.rc | default('?') }}
      stdout={{ item.stdout | default('') | truncate(300) }}
      stderr={{ item.stderr | default('') | truncate(300) }}
  loop: "{{ _lab_collection_publish.results }}"
  loop_control:
    label: "{{ item.item | basename }}"

- name: Fail with ansible-galaxy publish output when upload failed
  ansible.builtin.fail:
    msg: >-
      ansible-galaxy publish failed for {{ item.item | basename }}
      (rc={{ item.rc | default('?') }}).
      publish_url={{ _lab_galaxy_publish_url }}
      stdout: {{ item.stdout | default('') }}
      stderr: {{ item.stderr | default('') }}
  when:
    - (item.rc | default(0)) != 0
    - ('already' not in ((item.stdout | default('')) ~ ' ' ~ (item.stderr | default(''))) | lower)
  loop: "{{ _lab_collection_publish.results }}"
  loop_control:
    label: "{{ item.item | basename }}"

# Tarball name: <namespace>-<name>-<version>.tar.gz
- name: Resolve collection namespace/name/version from each tarball name
  ansible.builtin.set_fact:
    _lab_collection_coords: "{{ _lab_collection_coords | default([]) + [_coord] }}"
  vars:
    _base: "{{ item | basename }}"
    _coord:
      namespace: "{{ _base | regex_replace('^([^-]+)-.*$', '\\1') }}"
      name: "{{ _base | regex_replace('^[^-]+-([^-]+)-.*$', '\\1') }}"
      version: "{{ _base | regex_replace('^[^-]+-[^-]+-(.*)\\.tar\\.gz$', '\\1') }}"
  loop: "{{ _lab_collection_tarballs }}"
  when: _lab_collection_coords is not defined or (_lab_collection_coords | length) < (_lab_collection_tarballs | length)
  loop_control:
    label: "{{ item | basename }}"

# Import lands in staging (approval required) or published (auto-approve).
- name: Wait until each collection version appears in Hub staging
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/staging/collections/index/{{ item.namespace }}/{{ item.name }}/versions/{{ item.version }}/"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_staging_get
  until: (_lab_staging_get.status | default(0)) == 200
  retries: 24
  delay: 5
  loop: "{{ _lab_collection_coords }}"
  failed_when: false
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}:{{ item.version }}"

- name: Check published for collections not yet in staging
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/published/collections/index/{{ item.item.namespace }}/{{ item.item.name }}/versions/{{ item.item.version }}/"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_published_early
  until: (_lab_published_early.status | default(0)) == 200
  retries: 12
  delay: 5
  loop: "{{ _lab_staging_get.results }}"
  when: (item.status | default(0)) != 200
  failed_when: false
  loop_control:
    label: "{{ item.item.namespace }}.{{ item.item.name }}:{{ item.item.version }}"

- name: Summarize where each collection version landed
  ansible.builtin.set_fact:
    _lab_land_summary: "{{ _lab_land_summary | default([]) + [_row] }}"
  vars:
    _coord: "{{ item }}"
    _idx: "{{ ansible_loop.index0 }}"
    _st: "{{ _lab_staging_get.results[_idx | int].status | default(0) | int }}"
    _pub_matches: >-
      {{
        _lab_published_early.results | default([])
        | selectattr('skipped', 'undefined')
        | selectattr('item.item.namespace', 'defined')
        | selectattr('item.item.namespace', 'equalto', _coord.namespace)
        | selectattr('item.item.name', 'equalto', _coord.name)
        | list
      }}
    _pub: >-
      {{
        (_pub_matches[0].status | default(0) | int)
        if (_pub_matches | length) > 0 else 0
      }}
    _row:
      namespace: "{{ _coord.namespace }}"
      name: "{{ _coord.name }}"
      version: "{{ _coord.version }}"
      staging: "{{ _st }}"
      published: "{{ _pub }}"
      # Move only when in staging and not already published
      needs_move: "{{ (_st == 200) and (_pub != 200) }}"
      found: "{{ (_st == 200) or (_pub == 200) }}"
  loop: "{{ _lab_collection_coords }}"
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}:{{ item.version }}"
    extended: true

- name: Show landing summary after import
  ansible.builtin.debug:
    var: _lab_land_summary

- name: Fail early if a collection never appeared in staging or published
  ansible.builtin.fail:
    msg: >-
      Collection {{ item.namespace }}.{{ item.name }}:{{ item.version }} did not
      appear in Hub staging or published after ansible-galaxy publish.
      staging_http={{ item.staging }} published_http={{ item.published }}.
      publish_url={{ _lab_galaxy_publish_url }}.
      "Pushed" with --no-wait only means upload accepted — check Hub Imports
      on {{ aap_selfservice_custom_controller_url }}.
  when: not (item.found | bool)
  loop: "{{ _lab_land_summary }}"
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}"

- name: Move lab collections from staging to published when needed
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/collections/{{ item.namespace }}/{{ item.name }}/versions/{{ item.version }}/move/staging/published/"
    method: POST
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 201, 202, 204, 400, 404]
    return_content: true
  loop: "{{ _lab_land_summary }}"
  when: item.needs_move | bool
  register: _lab_collection_move
  failed_when: false
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}:{{ item.version }}"

- name: Show move results
  ansible.builtin.debug:
    msg: >-
      {{ item.item.namespace }}.{{ item.item.name }}:{{ item.item.version }}
      staging → published: HTTP={{ item.status | default('skipped') }}
      body={{ item.content | default('') | truncate(200) }}
  loop: "{{ _lab_collection_move.results | default([]) }}"
  when: item is not skipped
  loop_control:
    label: "{{ item.item.namespace }}.{{ item.item.name }}"

- name: Wait briefly for Hub move tasks
  ansible.builtin.pause:
    seconds: 15
    prompt: "Waiting for Hub to finish moving Northwind collections to published..."

- name: Verify each lab collection is visible in Hub published
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/published/collections/index/{{ item.namespace }}/{{ item.name }}/"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_published_get
  until: (_lab_published_get.status | default(0)) == 200
  retries: 36
  delay: 5
  loop: "{{ _lab_collection_coords }}"
  failed_when: false
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}"

- name: Fail if any Northwind collection is missing from Hub published
  ansible.builtin.assert:
    that:
      - (_lab_published_get.results | map(attribute='status') | list | min) == 200
    fail_msg: >-
      Hub `published` still missing collections after import/move.
      land_summary={{ _lab_land_summary }}.
      published_http={{ _lab_published_get.results | map(attribute='status') | list }}.
      publish_url={{ _lab_galaxy_publish_url }}.
      Check Hub UI Imports/Approval on {{ aap_selfservice_custom_controller_url }}.

- name: Remove temporary galaxy server config
  ansible.builtin.file:
    path: "{{ _lab_galaxy_cfg }}"
    state: absent
  no_log: true

- name: Report lab collections publish status
  ansible.builtin.debug:
    msg: >-
      Published {{ portal_lab_collections | length }} Northwind collection(s)
      to {{ aap_selfservice_custom_controller_url }} Hub published
      via {{ _lab_galaxy_publish_url }}
      (namespace={{ portal_lab_collection_namespace }}).
      Portal Collections → Sync Now should list northwind.*.
