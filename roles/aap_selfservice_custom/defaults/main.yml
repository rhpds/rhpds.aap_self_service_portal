# -------------------------------------------------------------------
# EE Builder — pre-create GitHub repo per AAP instance
# -------------------------------------------------------------------
# Creates lab-{{ guid }} team, {{ guid }}-{{ user }}-ee repo, Actions
# Galaxy + REGISTRY secrets/vars, team push. Requires portal_github_token.
aap_selfservice_custom_provision_ee_github_repos: true
# On AgnosticD ACTION=destroy|stop: delete matching {{ guid }}-*-ee repos and team.
aap_selfservice_custom_deprovision_ee_github_repos: true

# -------------------------------------------------------------------
# Lab collections (Northwind) → each instance Hub `published`
# -------------------------------------------------------------------
# Bundled under files/lab_collections/. Built once per provision host,
# uploaded to every AAP Hub (multi-instance safe — Hubs are independent).
# Git repos tab uses the org GitHub repos (no provision publish needed).
aap_selfservice_custom_publish_lab_collections: true
portal_lab_collection_namespace: northwind
portal_lab_collections:
  - northwind.platform
  - northwind.cloud
  - northwind.network

# -------------------------------------------------------------------
# Hub remotes (curated — avoid full catalog sync)
# -------------------------------------------------------------------
# configure_hub_remotes.yml PATCHes pulp remotes + kicks repository sync.
aap_selfservice_custom_configure_hub_remotes: true
# Seconds to poll each sync task (validated=all can run long; we still wait)
aap_selfservice_custom_hub_sync_timeout: 1800
aap_selfservice_custom_hub_sync_delay: 30

portal_hub_rh_certified_collections:
  - redhat.rhel_system_roles
  - redhat.insights
  - ansible.posix
  - ansible.utils
  - ansible.controller
  - amazon.aws
  - amazon.ai
  - azure.azcollection
  - google.cloud
  - vmware.vmware_rest
  - ansible.netcommon
  - cisco.ios
  - cisco.nxos
  - cisco.aci
  - cisco.iosxr
  - arista.eos
  - junipernetworks.junos
  - f5networks.f5_modules
  - ansible.windows
  - microsoft.ad

portal_hub_community_collections:
  - community.general
  - community.crypto
  - community.postgresql
  - community.mysql
  - community.windows
  - community.dns

# Remote definitions consumed by configure_hub_remotes.yml
portal_hub_remotes:
  - name: rh-certified
    url: "https://console.redhat.com/api/automation-hub/content/published/"
    auth_url: "{{ portal_rh_sso_token_url }}"
    use_token: true
    # requirements built from portal_hub_rh_certified_collections
    requirements_collections: "{{ portal_hub_rh_certified_collections }}"
    wait_sync: true
  - name: validated
    url: "https://console.redhat.com/api/automation-hub/content/validated/"
    auth_url: "{{ portal_rh_sso_token_url }}"
    use_token: true
    # empty = sync all validated content
    requirements_collections: []
    wait_sync: true
  - name: community
    url: "https://galaxy.ansible.com/api/"
    auth_url: ""
    use_token: false
    requirements_collections: "{{ portal_hub_community_collections }}"
    wait_sync: true

# -------------------------------------------------------------------
# Behavior Settings
# -------------------------------------------------------------------
# Skip resources that already exist (idempotent)
aap_selfservice_custom_skip_existing: true

# Enable debug output
aap_selfservice_custom_debug: false
