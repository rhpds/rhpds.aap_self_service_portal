---
- name: Skip change-window enforcement when bypassed
  ansible.builtin.meta: end_role
  when: not (northwind_change_window_enforce | bool) or (northwind_change_window_bypass | bool)

- name: Evaluate whether current time is inside the change window
  ansible.builtin.set_fact:
    _nw_in_window: >-
      {{
        (now(utc=true, fmt='%w') | int in northwind_change_window_days)
        and (now(utc=true, fmt='%H') | int >= northwind_change_window_start_hour | int)
        and (now(utc=true, fmt='%H') | int < northwind_change_window_end_hour | int)
      }}

- name: Fail when outside the approved Northwind change window
  ansible.builtin.fail:
    msg: >-
      Change blocked by northwind.platform.change_window.
      Allowed days={{ northwind_change_window_days }}
      hours={{ northwind_change_window_start_hour }}-{{ northwind_change_window_end_hour }}
      tz={{ northwind_change_window_tz }}.
      Set northwind_change_window_bypass=true only with CAB approval.
  when: not (_nw_in_window | bool)
