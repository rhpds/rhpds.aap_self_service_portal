---
# ---------------------------------------------------------------
# Validate Single AAP Operator (One User)
# ---------------------------------------------------------------
# Validates AAP operator in one user's namespace
# Namespace: {user_prefix}{user_number}-aap (e.g., user1-aap)
#
# Checks:
# - Operator CSV status (Succeeded)
# - Operator pods running

- name: Set AAP operator validation variables for user{{ user_number }}
  ansible.builtin.set_fact:
    _aap_op_user: "{{ ocp4_workload_aap_multiinstance_validation_user_prefix }}{{ user_number }}"
    _aap_op_namespace: "{{ ocp4_workload_aap_multiinstance_validation_user_prefix }}{{ user_number }}{{ ocp4_workload_aap_multiinstance_validation_aap_namespace_suffix }}"

# ---------------------------------------------------------------
# Check AAP operator CSV
# ---------------------------------------------------------------
- name: Check AAP operator CSV in {{ _aap_op_namespace }}
  kubernetes.core.k8s_info:
    api_version: operators.coreos.com/v1alpha1
    kind: ClusterServiceVersion
    namespace: "{{ _aap_op_namespace }}"
  register: _aap_operator_csv_info
  ignore_errors: true

- name: Parse AAP operator CSV status for {{ _aap_op_user }}
  ansible.builtin.set_fact:
    _aap_operator_csv_status: >-
      {{
        (_aap_operator_csv_info.resources | default([]) |
         selectattr('metadata.name', 'search', 'aap-operator') |
         list | first).status.phase | default('NotFound')
        if (_aap_operator_csv_info.resources | default([]) |
            selectattr('metadata.name', 'search', 'aap-operator') |
            list | length > 0)
        else 'NotFound'
      }}

# ---------------------------------------------------------------
# Check AAP operator deployments
# ---------------------------------------------------------------
- name: Check AAP operator deployments in {{ _aap_op_namespace }}
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    namespace: "{{ _aap_op_namespace }}"
  register: _aap_operator_deployments
  ignore_errors: true

- name: Filter operator deployments (pattern: *-operator-controller-manager)
  ansible.builtin.set_fact:
    _aap_operator_deployment_list: >-
      {{
        _aap_operator_deployments.resources | default([]) |
        selectattr('metadata.name', 'search', '-operator-controller-manager$') |
        list
      }}

# ---------------------------------------------------------------
# Check AAP operator pods
# ---------------------------------------------------------------
- name: Check AAP operator pods in {{ _aap_op_namespace }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _aap_op_namespace }}"
    label_selectors:
      - control-plane=controller-manager
  register: _aap_operator_pods
  ignore_errors: true

- name: Count AAP operator pods for {{ _aap_op_user }}
  ansible.builtin.set_fact:
    _aap_operator_deployments_count: "{{ _aap_operator_deployment_list | length }}"
    _aap_operator_pods_running: >-
      {{
        _aap_operator_pods.resources | default([]) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length
      }}
    _aap_operator_pods_total: "{{ _aap_operator_pods.resources | default([]) | length }}"

# ---------------------------------------------------------------
# Determine validation status
# ---------------------------------------------------------------
- name: Determine AAP Operator status for {{ _aap_op_user }}
  ansible.builtin.set_fact:
    _aap_operator_status: >-
      {{
        'failed' if (
          _aap_operator_csv_status != 'Succeeded' or
          _aap_operator_deployments_count | int == 0 or
          _aap_operator_pods_running | int == 0
        )
        else 'degraded' if (
          _aap_operator_pods_running | int != _aap_operator_pods_total | int
        )
        else 'healthy'
      }}

# ---------------------------------------------------------------
# Add validation result
# ---------------------------------------------------------------
- name: Add AAP Operator validation result for {{ _aap_op_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_results: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_results + [{
          'component': 'AAP Operator - ' ~ _aap_op_user,
          'status': _aap_operator_status,
          'namespace': _aap_op_namespace,
          'details': {
            'csv_status': _aap_operator_csv_status,
            'operator_deployments': _aap_operator_deployments_count | string,
            'pods': _aap_operator_pods_running ~ '/' ~ _aap_operator_pods_total
          }
        }]
      }}

# ---------------------------------------------------------------
# Add issues if any
# ---------------------------------------------------------------
- name: Add AAP Operator issues for {{ _aap_op_user }} if CSV not succeeded
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _aap_op_user ~ ' AAP Operator: CSV ' ~ _aap_operator_csv_status ~ ' (expected Succeeded)'
        ]
      }}
  when:
    - _aap_operator_status in ['failed', 'degraded']
    - _aap_operator_csv_status != 'Succeeded'

- name: Add AAP Operator issues for {{ _aap_op_user }} if pods not running
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _aap_op_user ~ ' AAP Operator: ' ~ _aap_operator_pods_running ~ '/' ~ _aap_operator_pods_total ~ ' pods running'
        ]
      }}
  when:
    - _aap_operator_status in ['failed', 'degraded']
    - _aap_operator_pods_running | int != _aap_operator_pods_total | int
