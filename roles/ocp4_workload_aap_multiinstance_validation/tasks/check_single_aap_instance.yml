---
# ---------------------------------------------------------------
# Validate Single AAP Instance for One User
# ---------------------------------------------------------------
# Called by check_aap_instances.yml for each user

- name: Set current user variables
  ansible.builtin.set_fact:
    _current_user: "{{ ocp4_workload_aap_multiinstance_validation_user_prefix }}{{ user_number }}"
    _current_namespace: "{{ ocp4_workload_aap_multiinstance_validation_user_prefix }}{{ user_number }}{{ ocp4_workload_aap_multiinstance_validation_aap_namespace_suffix }}"

# ---------------------------------------------------------------
# Check AutomationController CR
# ---------------------------------------------------------------
- name: Check AutomationController CR for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: automationcontroller.ansible.com/v1beta1
    kind: AutomationController
    namespace: "{{ _current_namespace }}"
  register: _aap_controller_cr
  ignore_errors: true
  when: ocp4_workload_aap_multiinstance_validation_check_controller | bool

- name: Parse AutomationController status for {{ _current_user }}
  ansible.builtin.set_fact:
    _controller_ready: >-
      {{
        (_aap_controller_cr.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'Running') |
         list | first).status | default('False')
        if _aap_controller_cr.resources | default([]) | length > 0
        else 'NotFound'
      }}
  when: ocp4_workload_aap_multiinstance_validation_check_controller | bool

# ---------------------------------------------------------------
# Check EDA CR
# ---------------------------------------------------------------
- name: Check EDA CR for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: eda.ansible.com/v1alpha1
    kind: EDA
    namespace: "{{ _current_namespace }}"
  register: _aap_eda_cr
  ignore_errors: true
  when: ocp4_workload_aap_multiinstance_validation_check_eda | bool

- name: Parse EDA status for {{ _current_user }}
  ansible.builtin.set_fact:
    _eda_ready: >-
      {{
        (_aap_eda_cr.resources[0].status.conditions | default([]) |
         selectattr('type', 'equalto', 'Running') |
         list | first).status | default('False')
        if _aap_eda_cr.resources | default([]) | length > 0
        else 'NotFound'
      }}
  when: ocp4_workload_aap_multiinstance_validation_check_eda | bool

# ---------------------------------------------------------------
# Check AAP Controller pods
# ---------------------------------------------------------------
- name: Check AAP Controller pods for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _current_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=awx
  register: _aap_controller_pods
  ignore_errors: true
  when: ocp4_workload_aap_multiinstance_validation_check_controller | bool

- name: Count running AAP Controller pods for {{ _current_user }}
  ansible.builtin.set_fact:
    _controller_pods_running: >-
      {{
        _aap_controller_pods.resources | default([]) |
        selectattr('status.phase', 'equalto', 'Running') |
        selectattr('status.containerStatuses', 'defined') |
        selectattr('status.containerStatuses', 'all', 'ready', true) |
        list | length
      }}
    _controller_pods_total: "{{ _aap_controller_pods.resources | default([]) | length }}"
  when: ocp4_workload_aap_multiinstance_validation_check_controller | bool

# ---------------------------------------------------------------
# Check AAP EDA pods
# ---------------------------------------------------------------
- name: Check AAP EDA pods for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _current_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=eda
  register: _aap_eda_pods
  ignore_errors: true
  when: ocp4_workload_aap_multiinstance_validation_check_eda | bool

- name: Count running AAP EDA pods for {{ _current_user }}
  ansible.builtin.set_fact:
    _eda_pods_running: >-
      {{
        _aap_eda_pods.resources | default([]) |
        selectattr('status.phase', 'equalto', 'Running') |
        selectattr('status.containerStatuses', 'defined') |
        selectattr('status.containerStatuses', 'all', 'ready', true) |
        list | length
      }}
    _eda_pods_total: "{{ _aap_eda_pods.resources | default([]) | length }}"
  when: ocp4_workload_aap_multiinstance_validation_check_eda | bool

# ---------------------------------------------------------------
# Check PostgreSQL pods
# ---------------------------------------------------------------
- name: Check PostgreSQL pods for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _current_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=database
  register: _aap_postgres_pods
  ignore_errors: true

- name: Count running PostgreSQL pods for {{ _current_user }}
  ansible.builtin.set_fact:
    _postgres_pods_running: >-
      {{
        _aap_postgres_pods.resources | default([]) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length
      }}
    _postgres_pods_total: "{{ _aap_postgres_pods.resources | default([]) | length }}"

# ---------------------------------------------------------------
# Check Redis pods
# ---------------------------------------------------------------
- name: Check Redis pods for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ _current_namespace }}"
    label_selectors:
      - app.kubernetes.io/component=redis
  register: _aap_redis_pods
  ignore_errors: true

- name: Count running Redis pods for {{ _current_user }}
  ansible.builtin.set_fact:
    _redis_pods_running: >-
      {{
        _aap_redis_pods.resources | default([]) |
        selectattr('status.phase', 'equalto', 'Running') |
        list | length
      }}
    _redis_pods_total: "{{ _aap_redis_pods.resources | default([]) | length }}"

# ---------------------------------------------------------------
# Check AAP Gateway route (AAP 2.6 architecture)
# ---------------------------------------------------------------
- name: Check AAP Gateway route for {{ _current_user }}
  kubernetes.core.k8s_info:
    api_version: route.openshift.io/v1
    kind: Route
    namespace: "{{ _current_namespace }}"
  register: _aap_routes
  ignore_errors: true

- name: Extract AAP Gateway route for {{ _current_user }}
  ansible.builtin.set_fact:
    _aap_gateway_route_url: >-
      {{
        'https://' + (_aap_routes.resources | default([]) |
         selectattr('metadata.name', 'match', '^' + _current_user + '-aap$') |
         list | first).spec.host
        if (_aap_routes.resources | default([]) |
            selectattr('metadata.name', 'match', '^' + _current_user + '-aap$') |
            list | length > 0)
        else ''
      }}

- name: Extract AAP Controller route for {{ _current_user }}
  ansible.builtin.set_fact:
    _aap_controller_route_url: >-
      {{
        'https://' + (_aap_routes.resources | default([]) |
         selectattr('metadata.name', 'search', 'controller') |
         list | first).spec.host
        if (_aap_routes.resources | default([]) |
            selectattr('metadata.name', 'search', 'controller') |
            list | length > 0)
        else ''
      }}

# ---------------------------------------------------------------
# Test AAP Gateway route HTTP accessibility
# ---------------------------------------------------------------
- name: Test AAP Gateway route HTTP accessibility for {{ _current_user }}
  ansible.builtin.uri:
    url: "{{ _aap_gateway_route_url }}/api/gateway/v1/"
    method: GET
    validate_certs: "{{ ocp4_workload_aap_multiinstance_validation_http_validate_certs }}"
    status_code: "{{ ocp4_workload_aap_multiinstance_validation_http_success_codes }}"
    timeout: "{{ ocp4_workload_aap_multiinstance_validation_http_timeout }}"
  register: _aap_gateway_http_check
  ignore_errors: true
  when: _aap_gateway_route_url | length > 0

# ---------------------------------------------------------------
# Determine AAP instance status for this user
# ---------------------------------------------------------------
- name: Determine AAP instance status for {{ _current_user }}
  ansible.builtin.set_fact:
    _aap_instance_status: >-
      {{
        'failed' if (
          (ocp4_workload_aap_multiinstance_validation_check_controller | bool and _controller_ready != 'True') or
          (ocp4_workload_aap_multiinstance_validation_check_eda | bool and _eda_ready != 'True') or
          (ocp4_workload_aap_multiinstance_validation_check_controller | bool and _controller_pods_running | int == 0) or
          (ocp4_workload_aap_multiinstance_validation_check_eda | bool and _eda_pods_running | int == 0) or
          _postgres_pods_running | int == 0 or
          _redis_pods_running | int == 0 or
          _aap_gateway_route_url | length == 0
        )
        else 'degraded' if (
          _aap_gateway_http_check is failed or
          (ocp4_workload_aap_multiinstance_validation_check_controller | bool and _controller_pods_running | int != _controller_pods_total | int) or
          (ocp4_workload_aap_multiinstance_validation_check_eda | bool and _eda_pods_running | int != _eda_pods_total | int) or
          _postgres_pods_running | int != _postgres_pods_total | int or
          _redis_pods_running | int != _redis_pods_total | int
        )
        else 'healthy'
      }}

# ---------------------------------------------------------------
# Add AAP instance validation result
# ---------------------------------------------------------------
- name: Add AAP instance validation result for {{ _current_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_results: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_results + [{
          'component': 'AAP Instance - ' + _current_user,
          'status': _aap_instance_status,
          'namespace': _current_namespace,
          'details': {
            'controller_ready': _controller_ready if ocp4_workload_aap_multiinstance_validation_check_controller | bool else 'disabled',
            'controller_pods': (_controller_pods_running ~ '/' ~ _controller_pods_total) if ocp4_workload_aap_multiinstance_validation_check_controller | bool else 'disabled',
            'eda_ready': _eda_ready if ocp4_workload_aap_multiinstance_validation_check_eda | bool else 'disabled',
            'eda_pods': (_eda_pods_running ~ '/' ~ _eda_pods_total) if ocp4_workload_aap_multiinstance_validation_check_eda | bool else 'disabled',
            'postgres_pods': _postgres_pods_running ~ '/' ~ _postgres_pods_total,
            'redis_pods': _redis_pods_running ~ '/' ~ _redis_pods_total,
            'gateway_route': _aap_gateway_route_url,
            'controller_route': _aap_controller_route_url,
            'http_accessible': (_aap_gateway_http_check is success) if _aap_gateway_route_url | length > 0 else false
          }
        }]
      }}

# ---------------------------------------------------------------
# Add issues if failed or degraded
# ---------------------------------------------------------------
- name: Add AAP instance issues for {{ _current_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _current_user + ': Controller not ready'
        ]
      }}
  when:
    - _aap_instance_status in ['failed', 'degraded']
    - ocp4_workload_aap_multiinstance_validation_check_controller | bool
    - _controller_ready != 'True'

- name: Add AAP instance EDA issues for {{ _current_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _current_user + ': EDA not ready'
        ]
      }}
  when:
    - _aap_instance_status in ['failed', 'degraded']
    - ocp4_workload_aap_multiinstance_validation_check_eda | bool
    - _eda_ready != 'True'

- name: Add AAP instance HTTP issues for {{ _current_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _current_user + ': Gateway route not HTTP accessible'
        ]
      }}
  when:
    - _aap_instance_status == 'degraded'
    - _aap_gateway_http_check is failed

- name: Add AAP instance pod issues for {{ _current_user }}
  ansible.builtin.set_fact:
    _ocp4_workload_aap_multiinstance_validation_issues: >-
      {{
        _ocp4_workload_aap_multiinstance_validation_issues + [
          _current_user + ': ' + _controller_pods_running + '/' + _controller_pods_total + ' controller pods running'
        ]
      }}
  when:
    - _aap_instance_status in ['failed', 'degraded']
    - ocp4_workload_aap_multiinstance_validation_check_controller | bool
    - _controller_pods_running | int != _controller_pods_total | int
