---
- name: Require at least one instance id
  ansible.builtin.assert:
    that:
      - parasol_cloud_instance_ids | length > 0
    fail_msg: Set parasol_cloud_instance_ids to the EC2 instance id list to tag.

- name: Apply Parasol mandatory tags to EC2 instances
  amazon.aws.ec2_tag:
    region: "{{ parasol_cloud_region }}"
    resource: "{{ item }}"
    state: present
    tags: "{{ parasol_cloud_tags }}"
  loop: "{{ parasol_cloud_instance_ids }}"
  loop_control:
    label: "{{ item }}"
