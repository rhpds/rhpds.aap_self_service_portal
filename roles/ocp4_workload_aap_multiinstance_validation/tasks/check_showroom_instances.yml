---
# ---------------------------------------------------------------
# Validate All Showroom Instances (Per-User)
# ---------------------------------------------------------------
# Loops through all users and validates each Showroom deployment
# Showroom deploys in multi-user mode with namespace pattern:
#   showroom-{guid}-user{N}

- name: Validate Showroom instance for each user
  ansible.builtin.include_tasks:
    file: check_single_showroom.yml
  loop: "{{ range(1, ocp4_workload_aap_multiinstance_validation_num_users | int + 1) | list }}"
  loop_control:
    loop_var: user_number
    label: "user{{ user_number }}"
