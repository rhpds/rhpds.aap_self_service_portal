---
# defaults file for self-service
plugin_root_dir: "/tmp/aap-ssap-plugins"
helm_values: "{{ role_path }}/files/helm/values.yml"
openshift_namespace: ssap
helm_chart_version: "2.2.4"
helm_repo_url: "https://charts.openshift.io"
helm_repo_name: "openshift-helm-charts"
helm_chart_name: "redhat-rhaap-portal"
helm_release_name: "self-service"
rhdh_image_tag: "1.10"
controller_host: "" # AAP Controler Route  
oauth_redirect_uri_suffix: "/api/auth/rhaap/handler/frame"
controller_verify_ssl: false
aap_oauth_client_name: "Self Service"
aap_organization: "Default"
aap_ssl_verify: false

# GitHub OAuth App for EE Builder student login (USER_OAUTH_TOKEN).
# Create at https://github.com/settings/applications/new (or org Developer settings).
# Pilot callback: https://<portal-host>/api/auth/github/handler/frame
# Multi-instance: set OAuth App callback + this var to the proxy URL *including*
# /api/auth/github/handler/frame (Backstage derives the nonce cookie Path from
# callbackUrl pathname; a bare Function URL root yields Path=//github and breaks login).
# -------------------------------------------------------------------
# GitHub OAuth for the Self-Service Automation Portal
# -------------------------------------------------------------------
# @owner: Prakhar Srivastava <psrivast@redhat.com>
# @purpose: GitHub OAuth client identifier for portal authentication
# @impact: LOW - public application identifier; not sufficient for authentication
# @expiration: UNKNOWN
# @rotation: Rotate through the GitHub OAuth application settings
# @source: atrotter@redhat.com; RHDPCD-2178
# @exposure: Decrypted only during Ansible provisioning
portal_github_oauth_client_id: !vault |
          $ANSIBLE_VAULT;1.2;AES256;gpte_vault_0
          32623966393064633930373264336437613134663162633565376539653933326535396132376563
          6534616365623463323266376236363162363338656564630a373532653936656261656361353338
          33353334333338663938336366633234616135633939626531643964363433636266653136636532
          3737616635656664360a333262316264343936613934613738336266366136623665386563643037
          30643162386630306431333234386662383637333732353466366366633834316261

