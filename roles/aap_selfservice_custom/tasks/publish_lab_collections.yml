---
# SPDX-License-Identifier: MIT-0
# Put Northwind lab collections into Hub `published` for portal pahCollections.
#
# ansible-galaxy publish + staging/import has been unreliable on AAP gateway
# labs (upload returns "pushed", import never appears). Upload the tarball
# straight into pulp as a collection_version, then add it to the `published`
# repository — same end state, no staging/approval dance.
#
# Expects:
#   aap_selfservice_custom_controller_url / _admin_username / _admin_password
#   portal_lab_collections

- name: Set lab collections paths
  ansible.builtin.set_fact:
    _lab_collections_src: "{{ role_path }}/files/lab_collections"
    _lab_collections_build: /tmp/portal-lab-collections-build-{{ guid | default('lab') }}
    _lab_galaxy_api: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy"
    _lab_hub_pulp: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy/pulp/api/v3"

- name: Ensure lab collections build directory
  ansible.builtin.file:
    path: "{{ _lab_collections_build }}"
    state: directory
    mode: "0755"

- name: Build collection tarballs once per provision host
  when: _lab_collection_tarballs is not defined
  block:
    - name: Build each Northwind collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - build
          - "{{ _lab_collections_src }}/{{ item }}"
          - --output-path
          - "{{ _lab_collections_build }}"
      loop: "{{ portal_lab_collections }}"
      changed_when: true

    - name: Find built collection tarballs
      ansible.builtin.find:
        paths: "{{ _lab_collections_build }}"
        patterns: "*.tar.gz"
      register: _lab_collection_find

    - name: Record built tarball paths
      ansible.builtin.set_fact:
        _lab_collection_tarballs: "{{ _lab_collection_find.files | map(attribute='path') | list | sort }}"

    - name: Require built tarballs
      ansible.builtin.assert:
        that:
          - (_lab_collection_tarballs | length) == (portal_lab_collections | length)
        fail_msg: >-
          Expected {{ portal_lab_collections | length }} collection tarballs,
          found {{ _lab_collection_tarballs | length }}.

- name: Create Hub namespace for lab collections
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/_ui/v1/namespaces/"
    method: POST
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    body_format: json
    body:
      name: "{{ portal_lab_collection_namespace }}"
      groups: []
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [201, 204, 400, 409]
  failed_when: false
  no_log: true

- name: Look up Hub published repository
  ansible.builtin.uri:
    url: "{{ _lab_hub_pulp }}/repositories/ansible/ansible/?name=published"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: 200
  register: _lab_published_repo

- name: Require published repository
  ansible.builtin.assert:
    that:
      - (_lab_published_repo.json.results | default([]) | length) > 0
    fail_msg: Hub has no ansible repository named 'published'.

- name: Set published repository href
  ansible.builtin.set_fact:
    _lab_published_repo_href: "{{ _lab_published_repo.json.results[0].pulp_href }}"

# NOTE: list item `Accept: application/json` (unquoted) is parsed as a YAML
# mapping and becomes "{'Accept': 'application/json'}" → gateway HTML 400.
- name: Upload each collection tarball into pulp as collection_version
  ansible.builtin.command:
    argv:
      - curl
      - -sk
      - -u
      - "{{ aap_selfservice_custom_admin_username }}:{{ aap_selfservice_custom_admin_password }}"
      - -X
      - POST
      - -H
      - "Accept: application/json"
      - -F
      - "file=@{{ item }};type=application/octet-stream"
      - -o
      - "/tmp/portal-lab-cv-upload-{{ item | basename }}.json"
      - -w
      - "%{http_code}"
      - "{{ _lab_hub_pulp }}/content/ansible/collection_versions/"
  register: _lab_cv_upload
  changed_when: true
  no_log: true
  loop: "{{ _lab_collection_tarballs }}"
  loop_control:
    label: "{{ item | basename }}"

- name: Fail if pulp collection_version upload rejected
  ansible.builtin.fail:
    msg: >-
      Pulp collection_version upload failed for {{ item | basename }}
      HTTP={{ _code }}.
      Body={{ _body | truncate(500) }}
  vars:
    _code: >-
      {{
        (_lab_cv_upload.results
         | selectattr('item', 'equalto', item)
         | map(attribute='stdout')
         | list
         | first
         | default('?')
         | trim)
      }}
    _body: "{{ lookup('file', '/tmp/portal-lab-cv-upload-' ~ (item | basename) ~ '.json', errors='ignore') }}"
  when: _code not in ['200', '201', '202']
  loop: "{{ _lab_collection_tarballs }}"
  loop_control:
    label: "{{ item | basename }}"
- name: Read pulp upload task hrefs
  ansible.builtin.set_fact:
    _lab_cv_tasks: "{{ _lab_cv_tasks | default([]) + [_task] }}"
  vars:
    _body: "{{ lookup('file', '/tmp/portal-lab-cv-upload-' ~ (item.item | basename) ~ '.json') | from_json }}"
    _task:
      tarball: "{{ item.item | basename }}"
      task: "{{ _body.task | default('') }}"
  loop: "{{ _lab_cv_upload.results }}"
  loop_control:
    label: "{{ item.item | basename }}"

- name: Wait for pulp collection_version create tasks
  ansible.builtin.uri:
    url: >-
      {{
        item.task
        if (item.task | regex_search('^https?://'))
        else ((aap_selfservice_custom_controller_url | regex_replace('/$', '')) ~ item.task)
      }}
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: 200
  register: _lab_cv_task_poll
  until: (_lab_cv_task_poll.json.state | default('')) in ['completed', 'failed', 'canceled']
  retries: 36
  delay: 5
  loop: "{{ _lab_cv_tasks }}"
  loop_control:
    label: "{{ item.tarball }}"

- name: Fail if any collection_version create task failed
  ansible.builtin.fail:
    msg: >-
      Pulp failed creating collection_version for {{ item.item.tarball }}:
      state={{ item.json.state | default('?') }}
      error={{ item.json.error | default(item.json) | to_json | truncate(600) }}
  when: (item.json.state | default('')) != 'completed'
  loop: "{{ _lab_cv_task_poll.results }}"
  loop_control:
    label: "{{ item.item.tarball }}"

- name: Collect created collection_version content hrefs
  ansible.builtin.set_fact:
    _lab_cv_hrefs: "{{ _lab_cv_hrefs | default([]) + [item.json.created_resources[0]] }}"
  when:
    - item.json.created_resources is defined
    - (item.json.created_resources | length) > 0
  loop: "{{ _lab_cv_task_poll.results }}"
  loop_control:
    label: "{{ item.item.tarball }}"

- name: Require created collection_version hrefs
  ansible.builtin.assert:
    that:
      - (_lab_cv_hrefs | default([]) | length) == (_lab_collection_tarballs | length)
    fail_msg: >-
      Expected {{ _lab_collection_tarballs | length }} collection_version hrefs,
      got {{ _lab_cv_hrefs | default([]) | length }}.

- name: Add collection versions to Hub published repository
  ansible.builtin.uri:
    url: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}{{ _lab_published_repo_href }}modify/"
    method: POST
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    body_format: json
    body:
      add_content_units: "{{ _lab_cv_hrefs }}"
    status_code: [202, 200]
  register: _lab_published_modify

- name: Wait for published repository modify task
  ansible.builtin.uri:
    url: >-
      {{
        _lab_published_modify.json.task
        if (_lab_published_modify.json.task | default('') | regex_search('^https?://'))
        else (
          (aap_selfservice_custom_controller_url | regex_replace('/$', ''))
          ~ _lab_published_modify.json.task
        )
      }}
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: 200
  register: _lab_published_modify_task
  until: (_lab_published_modify_task.json.state | default('')) in ['completed', 'failed', 'canceled']
  retries: 36
  delay: 5
  when: (_lab_published_modify.json.task | default('') | length) > 0

- name: Fail if published modify task failed
  ansible.builtin.fail:
    msg: >-
      Failed adding collections to published:
      {{ _lab_published_modify_task.json.error | default(_lab_published_modify_task.json) | to_json | truncate(600) }}
  when:
    - _lab_published_modify_task is not skipped
    - (_lab_published_modify_task.json.state | default('')) != 'completed'

# Resolve coords for verify (tarball: ns-name-ver.tar.gz)
- name: Resolve collection coords from tarball names
  ansible.builtin.set_fact:
    _lab_collection_coords: "{{ _lab_collection_coords | default([]) + [_coord] }}"
  vars:
    _base: "{{ item | basename }}"
    _coord:
      namespace: "{{ _base | regex_replace('^([^-]+)-.*$', '\\1') }}"
      name: "{{ _base | regex_replace('^[^-]+-([^-]+)-.*$', '\\1') }}"
      version: "{{ _base | regex_replace('^[^-]+-[^-]+-(.*)\\.tar\\.gz$', '\\1') }}"
  loop: "{{ _lab_collection_tarballs }}"
  when: _lab_collection_coords is not defined or (_lab_collection_coords | length) < (_lab_collection_tarballs | length)
  loop_control:
    label: "{{ item | basename }}"

- name: Verify each lab collection is in Hub published
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/published/collections/index/{{ item.namespace }}/{{ item.name }}/"
    method: GET
    user: "{{ aap_selfservice_custom_admin_username }}"
    password: "{{ aap_selfservice_custom_admin_password }}"
    force_basic_auth: true
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_published_get
  until: (_lab_published_get.status | default(0)) == 200
  retries: 24
  delay: 5
  loop: "{{ _lab_collection_coords }}"
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}"

- name: Report lab collections publish status
  ansible.builtin.debug:
    msg: >-
      Added {{ portal_lab_collections | length }} Northwind collection(s) to Hub
      published on {{ aap_selfservice_custom_controller_url }}.
      Portal Collections → Sync Now should list northwind.*.
