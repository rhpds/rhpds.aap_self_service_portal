---
# SPDX-License-Identifier: MIT-0
# Publish bundled Northwind collections into this instance's Hub `published`
# repo so the portal Collections tab can sync them (pahCollections).
#
# Prefer per-namespace inbound:
#   {gateway}/api/galaxy/content/inbound-{namespace}/
# which exists only after the Hub namespace is created (UI API creates the
# inbound pulp repo/distribution). If inbound is still missing, fall back to
# root /api/galaxy/ (galaxy-ng "published" upload endpoint).
#
# Expects:
#   aap_selfservice_custom_controller_url / _admin_username / _admin_password
#   aap_selfservice_custom_oauthtoken (from create_gateway_token.yml)
#   portal_lab_collections (list of dir names under files/lab_collections/)

- name: Set lab collections workdir
  ansible.builtin.set_fact:
    _lab_collections_src: "{{ role_path }}/files/lab_collections"
    _lab_collections_build: /tmp/portal-lab-collections-build-{{ guid | default('lab') }}
    _lab_galaxy_api: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy"
    _lab_galaxy_inbound: "{{ aap_selfservice_custom_controller_url | regex_replace('/$', '') }}/api/galaxy/content/inbound-{{ portal_lab_collection_namespace }}/"
    _lab_galaxy_cfg: /tmp/portal-lab-galaxy-{{ guid | default('lab') }}.cfg

- name: Ensure lab collections build directory
  ansible.builtin.file:
    path: "{{ _lab_collections_build }}"
    state: directory
    mode: "0755"

- name: Build collection tarballs once per provision host
  when: _lab_collection_tarballs is not defined
  block:
    - name: Build each Northwind collection
      ansible.builtin.command:
        argv:
          - ansible-galaxy
          - collection
          - build
          - "{{ _lab_collections_src }}/{{ item }}"
          - --output-path
          - "{{ _lab_collections_build }}"
      loop: "{{ portal_lab_collections }}"
      changed_when: true

    - name: Find built collection tarballs
      ansible.builtin.find:
        paths: "{{ _lab_collections_build }}"
        patterns: "*.tar.gz"
      register: _lab_collection_find

    - name: Record built tarball paths
      ansible.builtin.set_fact:
        _lab_collection_tarballs: "{{ _lab_collection_find.files | map(attribute='path') | list | sort }}"

    - name: Require built tarballs
      ansible.builtin.assert:
        that:
          - (_lab_collection_tarballs | length) == (portal_lab_collections | length)
        fail_msg: >-
          Expected {{ portal_lab_collections | length }} collection tarballs in
          {{ _lab_collections_build }}, found {{ _lab_collection_tarballs | length }}.

# UI namespace API creates the inbound-{ns} pulp repo; v3 alone often does not.
- name: Create Hub namespace via UI API (creates inbound repo)
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/_ui/v1/namespaces/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    body_format: json
    body:
      name: "{{ portal_lab_collection_namespace }}"
      groups: []
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [201, 204, 400, 409]
    return_content: true
  register: _lab_ns_ui_create
  failed_when: false

- name: Create Hub namespace via v3 API (fallback)
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/namespaces/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    body_format: json
    body:
      name: "{{ portal_lab_collection_namespace }}"
      groups: []
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [201, 204, 400, 409]
    return_content: true
  register: _lab_ns_v3_create
  failed_when: false
  when: (_lab_ns_ui_create.status | default(0)) not in [201, 204, 400, 409]

- name: Confirm Hub namespace exists
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/_ui/v1/namespaces/?name={{ portal_lab_collection_namespace }}"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200]
    return_content: true
  register: _lab_ns_get
  failed_when: false

- name: Fail if Hub namespace could not be created or found
  ansible.builtin.fail:
    msg: >-
      Hub namespace '{{ portal_lab_collection_namespace }}' missing after create.
      UI create HTTP={{ _lab_ns_ui_create.status | default('n/a') }}
      body={{ _lab_ns_ui_create.content | default('') | truncate(400) }}.
      v3 create HTTP={{ _lab_ns_v3_create.status | default('n/a') }}
      body={{ _lab_ns_v3_create.content | default('') | truncate(400) }}.
      GET HTTP={{ _lab_ns_get.status | default('n/a') }}
      content={{ _lab_ns_get.content | default('') | truncate(400) }}.
  when: >-
    (_lab_ns_get.status | default(0)) != 200
    or (
      (
        _lab_ns_get.json.meta.count
        | default(_lab_ns_get.json.count
        | default((_lab_ns_get.json.data | default(_lab_ns_get.json.results | default([]))) | length))
      ) | int
    ) < 1

- name: Wait for inbound distribution to become available
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_inbound }}"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 401, 403, 404]
  register: _lab_inbound_probe
  until: (_lab_inbound_probe.status | default(0)) in [200, 401, 403]
  retries: 18
  delay: 5
  failed_when: false

- name: Choose galaxy publish URL (inbound if present, else root /api/galaxy/)
  ansible.builtin.set_fact:
    _lab_galaxy_publish_url: >-
      {{
        _lab_galaxy_inbound
        if (_lab_inbound_probe.status | default(0)) in [200, 401, 403]
        else (_lab_galaxy_api ~ '/')
      }}
    _lab_galaxy_publish_mode: >-
      {{
        'inbound'
        if (_lab_inbound_probe.status | default(0)) in [200, 401, 403]
        else 'root'
      }}

- name: Warn when falling back to root galaxy publish URL
  ansible.builtin.debug:
    msg: >-
      inbound {{ _lab_galaxy_inbound }} returned HTTP
      {{ _lab_inbound_probe.status | default('n/a') }}; publishing via
      {{ _lab_galaxy_publish_url }} instead.
  when: _lab_galaxy_publish_mode == 'root'

# Token in temp ansible.cfg so failure output is not no_log-censored.
# --no-wait: CLI import polling often fails on self-signed gateway TLS; we poll Hub APIs.
- name: Write temporary galaxy server config for publish
  ansible.builtin.copy:
    dest: "{{ _lab_galaxy_cfg }}"
    mode: "0600"
    content: |
      [galaxy]
      server_list = lab_hub_publish

      [galaxy_server.lab_hub_publish]
      url = {{ _lab_galaxy_publish_url | trim }}
      token = {{ aap_selfservice_custom_oauthtoken }}
  no_log: true

- name: Publish each lab collection tarball to Hub (no-wait)
  ansible.builtin.command:
    argv:
      - ansible-galaxy
      - collection
      - publish
      - "{{ item }}"
      - --server
      - lab_hub_publish
      - --ignore-certs
      - --no-wait
  environment:
    ANSIBLE_CONFIG: "{{ _lab_galaxy_cfg }}"
  loop: "{{ _lab_collection_tarballs }}"
  register: _lab_collection_publish
  changed_when: >-
    'already' not in (
      (_lab_collection_publish.stdout | default('')) ~ ' ' ~
      (_lab_collection_publish.stderr | default(''))
    ) | lower
  failed_when: false
  loop_control:
    label: "{{ item | basename }}"

- name: Fail with ansible-galaxy publish output when upload failed
  ansible.builtin.fail:
    msg: >-
      ansible-galaxy publish failed for {{ item.item | basename }}
      (rc={{ item.rc | default('?') }}).
      mode={{ _lab_galaxy_publish_mode }}
      publish_url={{ _lab_galaxy_publish_url | trim }}
      inbound_probe={{ _lab_inbound_probe.status | default('n/a') }}
      stdout: {{ item.stdout | default('') }}
      stderr: {{ item.stderr | default('') }}
  when:
    - (item.rc | default(0)) != 0
    - ('already' not in ((item.stdout | default('')) ~ ' ' ~ (item.stderr | default(''))) | lower)
  loop: "{{ _lab_collection_publish.results }}"
  loop_control:
    label: "{{ item.item | basename }}"
# Tarball name: <namespace>-<name>-<version>.tar.gz
- name: Resolve collection namespace/name/version from each tarball name
  ansible.builtin.set_fact:
    _lab_collection_coords: "{{ _lab_collection_coords | default([]) + [_coord] }}"
  vars:
    _base: "{{ item | basename }}"
    _coord:
      namespace: "{{ _base | regex_replace('^([^-]+)-.*$', '\\1') }}"
      name: "{{ _base | regex_replace('^[^-]+-([^-]+)-.*$', '\\1') }}"
      version: "{{ _base | regex_replace('^[^-]+-[^-]+-(.*)\\.tar\\.gz$', '\\1') }}"
  loop: "{{ _lab_collection_tarballs }}"
  when: _lab_collection_coords is not defined or (_lab_collection_coords | length) < (_lab_collection_tarballs | length)
  loop_control:
    label: "{{ item | basename }}"

- name: Wait until each collection version appears in Hub staging
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/staging/collections/index/{{ item.namespace }}/{{ item.name }}/versions/{{ item.version }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_staging_get
  until: (_lab_staging_get.status | default(0)) == 200
  retries: 36
  delay: 5
  loop: "{{ _lab_collection_coords }}"
  failed_when: false
  no_log: true
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}:{{ item.version }}"

- name: Check whether collections already landed in published
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/published/collections/index/{{ item.namespace }}/{{ item.name }}/versions/{{ item.version }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_published_version_get
  loop: "{{ _lab_collection_coords }}"
  failed_when: false
  no_log: true
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}:{{ item.version }}"

- name: Move lab collections from staging to published when needed
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/collections/{{ item.item.namespace }}/{{ item.item.name }}/versions/{{ item.item.version }}/move/staging/published/"
    method: POST
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 201, 202, 204, 400, 404]
    return_content: true
  loop: "{{ _lab_published_version_get.results }}"
  when:
    - (item.status | default(0)) != 200
    - (_lab_staging_get.results[ansible_loop.index0].status | default(0)) == 200
  register: _lab_collection_move
  failed_when: false
  no_log: true
  loop_control:
    label: "{{ item.item.namespace }}.{{ item.item.name }}:{{ item.item.version }}"
    extended: true

- name: Wait briefly for Hub move/import tasks
  ansible.builtin.pause:
    seconds: 20
    prompt: "Waiting for Hub to finish publishing Northwind collections..."

- name: Verify each lab collection is visible in Hub published
  ansible.builtin.uri:
    url: "{{ _lab_galaxy_api }}/v3/plugin/ansible/content/published/collections/index/{{ item.namespace }}/{{ item.name }}/"
    method: GET
    headers:
      Authorization: "Bearer {{ aap_selfservice_custom_oauthtoken }}"
    validate_certs: "{{ aap_selfservice_custom_verify_ssl }}"
    status_code: [200, 404]
  register: _lab_published_get
  until: (_lab_published_get.status | default(0)) == 200
  retries: 36
  delay: 5
  loop: "{{ _lab_collection_coords }}"
  no_log: true
  loop_control:
    label: "{{ item.namespace }}.{{ item.name }}"

- name: Fail if any Northwind collection is missing from Hub published
  ansible.builtin.assert:
    that:
      - (_lab_published_get.results | map(attribute='status') | list | min) == 200
    fail_msg: >-
      Hub `published` is missing one or more Northwind collections after publish/move.
      Staging HTTP statuses={{ _lab_staging_get.results | map(attribute='status') | list }}.
      publish_mode={{ _lab_galaxy_publish_mode }}
      publish_url={{ _lab_galaxy_publish_url | trim }}.
      Check Hub UI Imports/Approval on {{ aap_selfservice_custom_controller_url }}.

- name: Remove temporary galaxy server config
  ansible.builtin.file:
    path: "{{ _lab_galaxy_cfg }}"
    state: absent
  no_log: true

- name: Report lab collections publish status
  ansible.builtin.debug:
    msg: >-
      Published {{ portal_lab_collections | length }} Northwind collection(s)
      to {{ aap_selfservice_custom_controller_url }} Hub published
      via {{ _lab_galaxy_publish_url | trim }}
      (mode={{ _lab_galaxy_publish_mode }},
      namespace={{ portal_lab_collection_namespace }}).
      Portal Collections → Sync Now should list northwind.*.
