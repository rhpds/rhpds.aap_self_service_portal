---
# Deploy and wait for a single AAP instance in multi-user mode.
# Called sequentially from deploy_multiuser.yml to avoid Hub/resource races.

- name: Deploy AAP instance
  kubernetes.core.k8s:
    state: present
    template: aap_instance.yaml.j2
  vars:
    instance_name: "{{ item.name }}"
    instance_namespace: "{{ item.namespace }}"

- name: Wait for AAP instance to be ready
  kubernetes.core.k8s_info:
    api_version: aap.ansible.com/v1alpha1
    kind: AnsibleAutomationPlatform
    name: "{{ item.name }}"
    namespace: "{{ item.namespace }}"
  register: r_aap_instance
  until:
    - r_aap_instance.resources | length > 0
    - r_aap_instance.resources[0].status.conditions is defined
    - r_aap_instance.resources[0].status.conditions | selectattr('type', 'equalto', 'Successful') | list | length > 0
    - (r_aap_instance.resources[0].status.conditions | selectattr('type', 'equalto', 'Successful') | first).status == "True"
  retries: "{{ _aap_wait_retries | int }}"
  delay: "{{ _aap_wait_delay | int }}"
  failed_when:
    - r_aap_instance.resources | length > 0
    - r_aap_instance.resources[0].status.conditions is defined
    - (r_aap_instance.resources[0].status.conditions | selectattr('type', 'equalto', 'Failure') | first | default({'status': 'False'})).status == "True"
