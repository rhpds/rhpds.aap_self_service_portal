---
# ---------------------------------------------------------------
# Validate AAP Operators (Per-User)
# ---------------------------------------------------------------
# AAP operators are deployed per-namespace (user1-aap, user2-aap, etc.)
# This validates operator CSV and pods in each user's AAP namespace

- name: Validate AAP operator for each user
  ansible.builtin.include_tasks:
    file: check_single_aap_operator.yml
  loop: "{{ range(1, ocp4_workload_aap_multiinstance_validation_num_users | int + 1) | list }}"
  loop_control:
    loop_var: user_number
    label: "user{{ user_number }}"
