---
# ---------------------------------------------------------------
# Validate AAP Instances (Per User)
# ---------------------------------------------------------------
# For multi-user deployments, checks EACH user's AAP instance:
# - AutomationController CR status
# - EDA CR status (if enabled)
# - AAP Controller pods running
# - AAP EDA pods running
# - PostgreSQL pods running
# - Redis pods running
# - AAP Gateway route exists and is accessible
# - AAP Controller route exists

- name: Loop through all users to validate AAP instances
  ansible.builtin.include_tasks: check_single_aap_instance.yml
  loop: "{{ range(1, ocp4_workload_aap_multiinstance_validation_num_users | int + 1) | list }}"
  loop_control:
    loop_var: user_number
    label: "{{ ocp4_workload_aap_multiinstance_validation_user_prefix }}{{ user_number }}"
